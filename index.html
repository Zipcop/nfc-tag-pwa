<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFC Aktionen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#14171C">
<link rel="stylesheet" href="style.css">
<script src="theme-generator.js"></script>
<script>
  // Ganz früh im <head> anwenden, bevor irgendetwas gerendert wird -
  // verhindert ein kurzes Aufblitzen der Standardfarben/-schriftgröße.
  applyStoredTheme();
  applyStoredFontScale();
</script>
</head>
<body>
<div class="app">

  <div id="dashboard-view">

    <!-- Gesperrter Zustand (Standard): keine Tag-Liste, nur Schloss + neutraler Hinweis. -->
    <div id="locked-screen">
      <button type="button" id="unlock-btn" class="lock-btn" aria-label="Verwaltung entsperren">
        <span class="icon" data-icon="lock"></span>
      </button>
      <div class="locked-hero">
        <span class="icon" data-icon="ripple"></span>
        <p>Halte einen Tag ans Handy</p>
      </div>
    </div>

    <!-- PIN-Eingabe/-Einrichtung: Inhalt wird dynamisch von lock.js befüllt. -->
    <div id="pin-screen" hidden></div>

    <!-- Entsperrter Zustand: volles Verwaltungs-Dashboard. -->
    <div id="unlocked-dashboard" hidden>
      <header class="page-header">
        <div class="brand-row">
          <span class="brand-mark" data-icon="logo"></span>
          <h1>NFC Aktionen</h1>
        </div>
        <p>Deine eingerichteten Tags auf diesem Handy.</p>
      </header>

      <a href="setup.html" class="btn btn-primary">
        <span class="icon" data-icon="plus"></span>
        Neuen Tag einrichten
      </a>

      <button type="button" id="tag-info-btn" class="btn btn-outline btn-block">
        <span class="icon" data-icon="info"></span>
        Tag-Infos anzeigen
      </button>

      <button type="button" id="theme-settings-btn" class="btn btn-outline btn-block">
        <span class="icon" data-icon="palette"></span>
        Design
      </button>

      <button type="button" id="push-subscribe-btn" class="btn btn-outline btn-block" hidden>
        <span class="icon" data-icon="bell"></span>
        Benachrichtigungen aktivieren
      </button>

      <div id="tag-list" class="tag-list"></div>

      <div id="empty-state" class="empty-state" hidden>
        <span class="ripple-icon" data-icon="ripple"></span>
        <h2>Hier entstehen deine Tags</h2>
        <p>Richte deinen ersten Tag ein und leg ihn direkt neben das Handy, um ihn zu beschreiben.</p>
      </div>
    </div>

  </div>

  <div id="action-view" hidden>
    <a href="index.html" class="back-link">
      <span class="icon" data-icon="back"></span>
      Zur Übersicht
    </a>
    <div id="action-content"></div>
  </div>

</div>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div id="modal-content" class="modal surface-card"></div>
</div>

<script src="icons.js"></script>
<script src="native.js"></script>
<script src="app.js"></script>
<script src="dashboard.js"></script>
<script src="action.js"></script>
<script src="nfc-tools.js"></script>
<script src="push.js"></script>
<script src="lock.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    hydrateIcons();
    const params = new URLSearchParams(window.location.search);
    if (params.has("type")) {
      initActionView(params);
    } else {
      document.getElementById("tag-info-btn").addEventListener("click", openTagInfoModal);
      document.getElementById("theme-settings-btn").addEventListener("click", openThemeSettingsModal);
      initLockGate();
    }
    registerServiceWorker();
  });
</script>
</body>
</html>
