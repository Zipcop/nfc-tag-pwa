<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFC Aktionen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#14171C">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div id="dashboard-view">
    <header class="page-header">
      <div class="brand-row">
        <span class="brand-mark" data-icon="logo"></span>
        <h1>NFC Aktionen</h1>
      </div>
      <p>Deine eingerichteten Tags auf diesem Handy.</p>
    </header>

    <a href="setup.html" class="btn btn-primary">
      <span class="icon" data-icon="plus"></span>
      Neuen Tag einrichten
    </a>

    <button type="button" id="tag-info-btn" class="btn btn-outline btn-block">
      <span class="icon" data-icon="info"></span>
      Tag-Infos anzeigen
    </button>

    <div id="tag-list" class="tag-list"></div>

    <div id="empty-state" class="empty-state" hidden>
      <span class="ripple-icon" data-icon="ripple"></span>
      <h2>Hier entstehen deine Tags</h2>
      <p>Richte deinen ersten Tag ein und leg ihn direkt neben das Handy, um ihn zu beschreiben.</p>
    </div>
  </div>

  <div id="action-view" hidden>
    <a href="index.html" class="back-link">
      <span class="icon" data-icon="back"></span>
      Zur Übersicht
    </a>
    <div id="action-content"></div>
  </div>

</div>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div id="modal-content" class="modal surface-card"></div>
</div>

<script src="icons.js"></script>
<script src="app.js"></script>
<script src="dashboard.js"></script>
<script src="action.js"></script>
<script src="nfc-tools.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    hydrateIcons();
    const params = new URLSearchParams(window.location.search);
    if (params.has("type")) {
      initActionView(params);
    } else {
      initDashboard();
      document.getElementById("tag-info-btn").addEventListener("click", openTagInfoModal);
    }
    registerServiceWorker();
  });
</script>
</body>
</html>
